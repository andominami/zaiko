<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>たんぽぽ歯科　文房具在庫管理</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" content="#fff4bd">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }

/* Layout: one narrow working column (max 760px); sticky header with section tabs. Pastel yellow + yellow-green to match the TANPOPO mark. */
:root {
  --bg: #fffbea; --surface: #ffffff; --sunk: #fff5cf; --ink: #3d3a24; --muted: #7a7250; --line: #f0e4b4;
  --head: linear-gradient(180deg, #fff1a8 0%, #fff8d6 100%); --head-top: #fff1a8;
  --accent: #4a8420; --accent-soft: #eef8dc;
  --btn: #bfe38a; --btn-ink: #2d4f10; --btn-line: #a6d16a;
  --danger: #c4452f; --danger-soft: #fde8e2; --warn: #9a6a00; --warn-soft: #fff0c4;
  --info: #3a6aa8; --info-soft: #e6effb; --ok: #3f7d22; --ok-soft: #e6f5d6; --grey: #857e66; --grey-soft: #f3efdf;
  --shadow: 0 10px 34px rgba(120,100,20,.18);
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --f-head: "Zen Maru Gothic", "BIZ UDPGothic", "Hiragino Maru Gothic ProN", "Yu Gothic UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1a12; --surface: #24231a; --sunk: #2c2a1d; --ink: #f3efd9; --muted: #bdb48f; --line: #3d3a28;
  --head: linear-gradient(180deg, #33301c 0%, #24231a 100%); --head-top: #33301c;
  --accent: #b5dc7c; --accent-soft: #2b3520; --btn: #a9d46e; --btn-ink: #1d300a; --btn-line: #a9d46e;
  --danger: #ff9a86; --danger-soft: #42231d; --warn: #f2c75c; --warn-soft: #3b3115; --info: #93b9f2; --info-soft: #1e2b40;
  --ok: #9ad773; --ok-soft: #22341a; --grey: #a39d84; --grey-soft: #2f2d22; --shadow: 0 10px 34px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #1b1a12; --surface: #24231a; --sunk: #2c2a1d; --ink: #f3efd9; --muted: #bdb48f; --line: #3d3a28;
  --head: linear-gradient(180deg, #33301c 0%, #24231a 100%); --head-top: #33301c;
  --accent: #b5dc7c; --accent-soft: #2b3520; --btn: #a9d46e; --btn-ink: #1d300a; --btn-line: #a9d46e;
  --danger: #ff9a86; --danger-soft: #42231d; --warn: #f2c75c; --warn-soft: #3b3115; --info: #93b9f2; --info-soft: #1e2b40;
  --ok: #9ad773; --ok-soft: #22341a; --grey: #a39d84; --grey-soft: #2f2d22; --shadow: 0 10px 34px rgba(0,0,0,.5); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head-top); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--head); border-bottom: 2px solid var(--line); border-radius: 0 0 22px 22px; box-shadow: 0 4px 14px rgba(200,170,40,.12); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; gap: 12px; padding-block: 10px 4px; }
.logo { width: 46px; height: 56px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 2px 3px rgba(150,120,0,.15)); }
.top h1 { font-family: var(--f-head); font-size: 21px; margin: 0; letter-spacing: .02em; flex: 1; min-width: 0; }
.top h1 small { display: block; font-family: var(--f-body); font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
@media (max-width: 420px) { .top h1 { font-size: 17px; letter-spacing: 0; } }
.tabs { display: flex; gap: 4px; }
.tab { flex: 1; border: 0; background: none; padding: 9px 4px 10px; border-radius: 14px 14px 0 0; font-family: var(--f-head); font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; display: flex; align-items: center; justify-content: center; gap: 6px; }
.tab[aria-current="page"] { color: var(--accent); border-bottom-color: var(--btn-line); background: color-mix(in srgb, var(--surface) 60%, transparent); }
.badge { min-width: 20px; padding: 0 6px; border-radius: 10px; font-size: 12px; line-height: 20px; background: var(--danger); color: #fff; }
.badge.info { background: var(--info); }

main { padding-block: 16px 96px; display: grid; gap: 16px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--btn); border-color: var(--btn-line); color: var(--btn-ink); font-weight: 700; }
.search { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; }

.note { border-radius: 18px; padding: 12px 14px; background: var(--sunk); color: var(--muted); font-size: 13.5px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.note b { color: var(--ink); }
.note .grow { flex: 1 1 240px; min-width: 0; }

.group h2 { font-family: var(--f-head); font-size: 14px; font-weight: 700; color: var(--muted); margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; letter-spacing: .04em; }
.group h2 span { font-family: var(--f-body); font-weight: 400; font-size: 12px; }
.catbar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.catbar .chip { flex-shrink: 0; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
.cat { border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 2px 8px rgba(200,170,40,.08); background: var(--surface); overflow: hidden; }
.cat-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
.cat-head h2 { margin: 0; font-family: var(--f-head); font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: .03em; flex: 1; min-width: 0; }
.cat-head h2 small { font-family: var(--f-body); font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.cat-head .warn { font-size: 12px; font-weight: 700; color: var(--danger); background: var(--danger-soft); border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
.cat .list { border: 0; border-radius: 0; }
.tag { display: inline-block; font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; line-height: 19px; margin-right: 6px; vertical-align: 1px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .main { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; display: grid; gap: 1px; }
.row .name { font-weight: 700; overflow-wrap: anywhere; }
.row .sub { font-size: 12.5px; color: var(--muted); }
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 0 7px; line-height: 20px; margin-right: 6px; vertical-align: 1px; }
.s-out { background: var(--danger-soft); color: var(--danger); }
.s-reorder { background: var(--danger-soft); color: var(--danger); }
.s-soon { background: var(--warn-soft); color: var(--warn); }
.s-ordered { background: var(--info-soft); color: var(--info); }
.s-unset { background: var(--grey-soft); color: var(--grey); }
.s-ok { background: var(--ok-soft); color: var(--ok); }
.stepper { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.stepper button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--sunk); font-size: 20px; line-height: 1; }
.stepper button:disabled { opacity: .4; cursor: default; }
.stepper .qty { min-width: 46px; text-align: center; font-size: 19px; font-weight: 700; }
.stepper .qty.zero { color: var(--danger); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; white-space: nowrap; }
.btn.primary { background: var(--btn); border-color: var(--btn-line); color: var(--btn-ink); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: none; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.inline { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.inline input { width: 64px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; text-align: right; background: var(--surface); }

.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; font-family: var(--f-head); }

.log { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13.5px; align-items: baseline; }
.log:first-child { border-top: 0; }
.log .t { color: var(--muted); }
.log .what { min-width: 0; overflow-wrap: anywhere; }
.log .who { color: var(--muted); font-size: 12px; }
.log .d { font-weight: 700; }
.d.minus { color: var(--danger); } .d.plus { color: var(--ok); } .d.order { color: var(--info); }

.fab { position: fixed; right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 6; border: 0; border-radius: 999px; padding: 13px 22px; background: var(--btn); color: var(--btn-ink); border: 2px solid var(--surface); font-weight: 700; font-family: var(--f-head); box-shadow: var(--shadow); }

.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(8,20,16,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 620px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px)); box-shadow: var(--shadow); display: grid; gap: 16px; }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 18px; max-height: 88%; } }
.sheet-head { display: flex; gap: 12px; align-items: flex-start; }
.sheet-head h3 { margin: 0; font-family: var(--f-head); font-size: 20px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sheet-head .sub { font-size: 12.5px; color: var(--muted); font-family: var(--f-body); font-weight: 400; display: block; }
.x { border: 0; background: var(--sunk); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; flex-shrink: 0; }
.big { display: flex; align-items: baseline; gap: 8px; }
.big .n { font-size: 40px; font-weight: 700; line-height: 1; }
.big .u { color: var(--muted); }
.box { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 12px; display: grid; gap: 10px; }
.box h4 { margin: 0; font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.formula { background: var(--sunk); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.formula b { font-size: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
label.f { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); min-width: 0; }
label.f input, label.f textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); color: var(--ink); font-size: 15px; width: 100%; }
label.f .hint { font-size: 11.5px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); z-index: 30; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }

.setup { max-width: 560px; margin: 28px auto; display: grid; gap: 16px; }
.setup::before { content: ""; justify-self: center; width: 120px; height: 145px; background: url(logo.png) center / contain no-repeat; }
.setup h2 { font-family: var(--f-head); margin: 0; font-size: 22px; text-align: center; }
.setup p { margin: 0; color: var(--muted); }
.copyline { display: flex; gap: 8px; flex-wrap: wrap; }
.copyline input { flex: 1 1 240px; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--sunk); color: var(--ink); font-size: 13px; }
.settings { display: grid; gap: 16px; }
.settings .box p { margin: 0; font-size: 13.5px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <img class="logo" src="logo.png" alt="">
      <h1>たんぽぽ歯科　文房具在庫管理<small id="sync">読み込み中…</small></h1>
    </div>
    <nav class="tabs" aria-label="表示切替" id="tabs" hidden>
      <button class="tab" data-view="order">発注<span class="badge" id="b-order" hidden></span></button>
      <button class="tab" data-view="stock">在庫一覧</button>
      <button class="tab" data-view="log">履歴</button>
      <button class="tab" data-view="settings">設定</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app">
  <div class="list"><div class="empty"><b>在庫データを読み込んでいます</b>品目の一覧と発注リストがここに出ます。</div></div>
</main>
<button class="fab" id="fab-add" hidden>＋ 品目を追加</button>
<div id="layer"></div>
<script type="module" src="app.js?v=7"></script>
</body>
</html>
